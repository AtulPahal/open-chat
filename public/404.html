<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - OpenChat</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #09090b;
      color: #ededed;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
    }
    h1 {
      font-size: 6rem;
      margin: 0;
      background: linear-gradient(135deg, #61DAFB, #646CFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    h2 {
      font-size: 1.5rem;
      margin-top: 10px;
      font-weight: 600;
    }
    p {
      color: #a1a1aa;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #fafafa;
      color: #18181b;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved.<br>Let's get you back to the chat.</p>
    <a href="/" class="btn">Return to OpenChat</a>
  </div>
</body>
</html>
